<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card bg-dark text-white shadow">
        <div class="card-header bg-warning text-dark text-center">
          <h3>Registro de Usuario</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Tipo de usuario</label>
            <select class="form-select" [(ngModel)]="tipo">
              <option value="visitante">Visitante</option>
              <option value="empresa">Empresa</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="nombre" required>
          </div>
          <div *ngIf="tipo === 'visitante'" class="mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" class="form-control" [(ngModel)]="apellido" required>
          </div>
          <div *ngIf="tipo === 'empresa'" class="mb-3">
            <label class="form-label">NIT</label>
            <input type="text" class="form-control" [(ngModel)]="nit" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" [(ngModel)]="correo" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña (mínimo 8 caracteres)</label>
            <input type="password" class="form-control" [(ngModel)]="contrasena" required>
          </div>
          <button type="submit" class="btn btn-warning w-100" (click)="onSubmit()">Registrarse</button>
          <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
