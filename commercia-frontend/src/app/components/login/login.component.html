<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card bg-dark text-white shadow">
        <div class="card-header bg-warning text-dark text-center">
          <h3>Iniciar Sesión</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Ingresar</button>
            <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
